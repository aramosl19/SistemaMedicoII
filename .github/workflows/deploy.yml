name: Build and Deploy Backend to Azure Container Apps
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3
      - name: Iniciar sesión en Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: sistemamedicoacr.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - name: Construir y subir imagen a ACR (con cache de capas)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: sistemamedicoacr.azurecr.io/sistemamedico-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Iniciar sesión en Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Desplegar en Azure Container Apps
        run: |
          az containerapp update \
            --name sistemamedico-backend \
            --resource-group rg-sistemamedico \
            --container-name sistemamedico-backend \
            --image sistemamedicoacr.azurecr.io/sistemamedico-backend:${{ github.sha }}
      - name: Borrar imágenes viejas del ACR (dejar solo la recién desplegada)
        run: |
          TAGS=$(az acr repository show-tags \
            --name sistemamedicoacr \
            --repository sistemamedico-backend \
            --orderby time_desc \
            --output tsv)
          echo "$TAGS" | tail -n +2 | while read tag; do
            az acr repository delete \
              --name sistemamedicoacr \
              --image sistemamedico-backend:$tag \
              --yes
          done

$kind: http-request
url: "{{base_url}}/api/farmacia/despacho"
method: POST
body:
  type: json
  content: |-
    {
      "recetaId": "{{receta_id}}",
      "metodoPago": "EFECTIVO",
      "montoRecibido": 100.0,
      "items": [
        {
          "detalleRecetaId": "{{detalle_receta_id}}",
          "cantidadDespachada": 15,
          "medicamentoSustitutoId": null,
          "razonSustitucion": null
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 2xx', function () {
          pm.expect(pm.response.code).to.be.oneOf([200,201]);
      });
    language: text/javascript
order: 2000

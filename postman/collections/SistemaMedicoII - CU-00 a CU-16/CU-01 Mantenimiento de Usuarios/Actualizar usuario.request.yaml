$kind: http-request
url: "{{base_url}}/api/usuarios/{{usuario_id}}"
method: PUT
body:
  type: json
  content: |-
    {
      "nombreCompleto": "Usuario De Prueba Postman Editado",
      "dpi": "1234567890123",
      "nit": "12345678",
      "correo": "prueba.postman@example.com",
      "nombreUsuario": "pruebapm",
      "telefono": "87654321",
      "rolId": "{{rol_id}}",
      "sucursalId": "{{sucursal_id}}",
      "activo": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 2xx', function () {
          pm.expect(pm.response.code).to.be.oneOf([200,201]);
      });
    language: text/javascript
order: 4000

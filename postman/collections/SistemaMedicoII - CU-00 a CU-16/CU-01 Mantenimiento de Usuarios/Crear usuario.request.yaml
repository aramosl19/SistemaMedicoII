$kind: http-request
url: "{{base_url}}/api/usuarios"
method: POST
body:
  type: json
  content: |-
    {
      "nombreCompleto": "Usuario De Prueba Postman",
      "dpi": "1234567890123",
      "nit": "12345678",
      "correo": "prueba.postman@example.com",
      "nombreUsuario": "pruebapm",
      "password": "ClaveSegura123!",
      "telefono": "12345678",
      "rolId": "{{rol_id}}",
      "sucursalId": "{{sucursal_id}}",
      "activo": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 2xx', function () {
          pm.expect(pm.response.code).to.be.oneOf([200,201]);
      });
      if (pm.response.code === 200 || pm.response.code === 201) {
          var jsonData = pm.response.json();
          if (jsonData.id !== undefined) {
              pm.collectionVariables.set('usuario_id', jsonData.id);
          }
      }
    language: text/javascript
order: 2000

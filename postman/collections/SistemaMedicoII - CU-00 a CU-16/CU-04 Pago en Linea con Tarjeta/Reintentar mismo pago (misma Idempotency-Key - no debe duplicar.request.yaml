$kind: http-request
name: Reintentar mismo pago (misma Idempotency-Key -> no debe duplicar cobro)
url: "{{base_url}}/api/pagos"
method: POST
headers:
  Idempotency-Key: "{{idempotency_key}}"
body:
  type: json
  content: |-
    {
      "citaId": "{{cita_id}}",
      "numeroTarjeta": "4111111111111111",
      "nombreTitular": "Usuario De Prueba Postman",
      "vencimiento": "12/29",
      "cvv": "123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Devuelve la misma transaccion (idempotente)', function () {
          pm.expect(pm.response.code).to.be.oneOf([200,201]);
      });
    language: text/javascript
order: 2000

$kind: http-request
url: "{{base_url}}/api/usuarios"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombreCompleto": "Diego Fernando Castillo Morán",
      "dpi": "8529637410369",
      "nit": "25836914",
      "correo": "diego.castillo@hospital.com",
      "nombreUsuario": "dcastillm",
      "password": "AdminSeguro2026!",
      "telefono": "22118899",
      "numeroSeguro": "SEG-00049",
      "rolId": 1,
      "sucursalId": 1,
      "activo": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 2xx', function () {
          pm.expect(pm.response.code).to.be.oneOf([200,201]);
      });
      if (pm.response.code === 200 || pm.response.code === 201) {
          var jsonData = pm.response.json();
          if (jsonData.id !== undefined) {
              pm.collectionVariables.set('usuario_admin_id', jsonData.id);
          }
      }
    language: text/javascript
order: 1000

$kind: http-request
url: "{{base_url}}/api/usuarios"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombreCompleto": "Carlos Andrés Ramírez Gómez",
      "dpi": "2345678901012",
      "nit": "23456782",
      "correo": "carlos.ramirez@gmail.com",
      "nombreUsuario": "cramirezg",
      "password": "PacienteSeguro2026!",
      "telefono": "55234567",
      "numeroSeguro": "SEG-00051",
      "rolId": 3,
      "sucursalId": 1,
      "activo": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 2xx', function () {
          pm.expect(pm.response.code).to.be.oneOf([200,201]);
      });
      if (pm.response.code === 200 || pm.response.code === 201) {
          var jsonData = pm.response.json();
          if (jsonData.id !== undefined) {
              pm.collectionVariables.set('paciente_directo_id', jsonData.id);
          }
      }
    language: text/javascript
order: 3000

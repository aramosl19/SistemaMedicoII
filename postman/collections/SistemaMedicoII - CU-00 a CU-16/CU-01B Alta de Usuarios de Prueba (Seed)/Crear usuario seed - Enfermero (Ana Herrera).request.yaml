$kind: http-request
url: "{{base_url}}/api/usuarios"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombreCompleto": "Ana Lucía Herrera Solís",
      "dpi": "3456789012123",
      "nit": "34567893",
      "correo": "ana.herrera@hospital.com",
      "nombreUsuario": "aherreras",
      "password": "EnfermeraSeguro2026!",
      "telefono": "55345678",
      "numeroSeguro": "SEG-00052",
      "rolId": 4,
      "sucursalId": 1,
      "activo": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 2xx', function () {
          pm.expect(pm.response.code).to.be.oneOf([200,201]);
      });
      if (pm.response.code === 200 || pm.response.code === 201) {
          var jsonData = pm.response.json();
          if (jsonData.id !== undefined) {
              pm.collectionVariables.set('enfermero_id', jsonData.id);
          }
      }
    language: text/javascript
order: 4000

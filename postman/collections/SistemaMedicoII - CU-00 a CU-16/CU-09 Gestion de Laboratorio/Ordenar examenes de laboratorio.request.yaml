$kind: http-request
url: "{{base_url}}/api/medico/citas/{{cita_id}}/orden-laboratorio"
method: POST
body:
  type: json
  content: |-
    {
      "examenesIds": [
        "{{examen_laboratorio_id}}"
      ],
      "esExterna": false,
      "notas": "En ayunas"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 2xx', function () {
          pm.expect(pm.response.code).to.be.oneOf([200,201]);
      });
      if (pm.response.code === 200 || pm.response.code === 201) {
          var jsonData = pm.response.json();
          if (jsonData.id !== undefined) {
              pm.collectionVariables.set('orden_laboratorio_id', jsonData.id);
          }
      }
      if (pm.response.code === 200 || pm.response.code === 201) {
          var jsonData = pm.response.json();
          if (jsonData.examenes && jsonData.examenes.length > 0 && jsonData.examenes[0].id !== undefined) {
              pm.collectionVariables.set('detalle_orden_id', jsonData.examenes[0].id);
          }
      }
    language: text/javascript
order: 1000

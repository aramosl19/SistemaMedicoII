$kind: http-request
url: "{{base_url}}/api/caja/laboratorio/cobro"
method: POST
body:
  type: json
  content: |-
    {
      "ordenId": "{{orden_laboratorio_id}}",
      "metodoPago": "EFECTIVO",
      "montoRecibido": 150.0
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 2xx', function () {
          pm.expect(pm.response.code).to.be.oneOf([200,201]);
      });
    language: text/javascript
order: 2000

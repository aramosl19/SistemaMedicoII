$kind: http-request
url: "{{base_url}}/api/portal/login"
method: POST
body:
  type: json
  content: |-
    {
      "nombreUsuario": "{{usuario_admin}}",
      "password": "{{password_admin}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 2xx', function () {
          pm.expect(pm.response.code).to.be.oneOf([200,201]);
      });
    language: text/javascript
order: 3000

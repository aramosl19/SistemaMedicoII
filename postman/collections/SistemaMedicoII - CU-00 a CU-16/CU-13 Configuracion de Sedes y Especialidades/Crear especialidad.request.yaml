$kind: http-request
url: "{{base_url}}/api/especialidades"
method: POST
body:
  type: json
  content: |-
    {
      "nombre": "Especialidad Prueba",
      "descripcion": "Especialidad de prueba",
      "estado": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 2xx', function () {
          pm.expect(pm.response.code).to.be.oneOf([200,201]);
      });
      if (pm.response.code === 200 || pm.response.code === 201) {
          var jsonData = pm.response.json();
          if (jsonData.id !== undefined) {
              pm.collectionVariables.set('especialidad_id_nueva', jsonData.id);
          }
      }
    language: text/javascript
order: 4000

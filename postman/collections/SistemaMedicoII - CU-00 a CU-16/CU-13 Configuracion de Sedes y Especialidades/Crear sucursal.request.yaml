$kind: http-request
url: "{{base_url}}/api/sucursales"
method: POST
body:
  type: json
  content: |-
    {
      "nombre": "Sede Prueba Postman",
      "descripcion": "Sede de prueba",
      "telefono": "22334455",
      "direccion": "Zona 10, Ciudad de Guatemala"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 2xx', function () {
          pm.expect(pm.response.code).to.be.oneOf([200,201]);
      });
      if (pm.response.code === 200 || pm.response.code === 201) {
          var jsonData = pm.response.json();
          if (jsonData.id !== undefined) {
              pm.collectionVariables.set('sucursal_id_nueva', jsonData.id);
          }
      }
    language: text/javascript
order: 2000

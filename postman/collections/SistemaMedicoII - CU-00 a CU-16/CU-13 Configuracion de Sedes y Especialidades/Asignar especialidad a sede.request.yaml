$kind: http-request
url: "{{base_url}}/api/sucursal-especialidad"
method: POST
body:
  type: json
  content: |-
    {
      "sucursalId": "{{sucursal_id}}",
      "especialidadId": "{{especialidad_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 2xx', function () {
          pm.expect(pm.response.code).to.be.oneOf([200,201]);
      });
    language: text/javascript
order: 5000

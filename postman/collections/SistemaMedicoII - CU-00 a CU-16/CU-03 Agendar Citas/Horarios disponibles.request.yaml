$kind: http-request
url: "{{base_url}}/api/citas/horarios-disponibles?medicoId={{medico_id}}&fecha={{fecha_futura}}"
method: GET
queryParams:
  medicoId: "{{medico_id}}"
  fecha: "{{fecha_futura}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 2xx', function () {
          pm.expect(pm.response.code).to.be.oneOf([200,201]);
      });
    language: text/javascript
order: 2000

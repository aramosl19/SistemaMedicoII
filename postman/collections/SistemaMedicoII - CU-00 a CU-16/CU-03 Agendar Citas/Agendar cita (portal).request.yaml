$kind: http-request
url: "{{base_url}}/api/citas"
method: POST
body:
  type: json
  content: |-
    {
      "pacienteId": "{{paciente_id}}",
      "medicoId": "{{medico_id}}",
      "sucursalId": "{{sucursal_id}}",
      "especialidadId": "{{especialidad_id}}",
      "tipoCitaId": "{{tipo_cita_id}}",
      "fechaHora": "{{fecha_hora_futura}}",
      "motivo": "Dolor de cabeza persistente desde hace tres dias, con nauseas ocasionales."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 2xx', function () {
          pm.expect(pm.response.code).to.be.oneOf([200,201]);
      });
      if (pm.response.code === 200 || pm.response.code === 201) {
          var jsonData = pm.response.json();
          if (jsonData.id !== undefined) {
              pm.collectionVariables.set('cita_id', jsonData.id);
          }
      }
    language: text/javascript
order: 3000

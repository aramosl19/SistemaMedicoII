$kind: http-request
url: "{{base_url}}/api/agenda/eventos/{{evento_id}}"
method: PUT
body:
  type: json
  content: |-
    {
      "titulo": "Capacitacion de manejo de emergencias (reprogramada)",
      "descripcion": "Capacitacion anual obligatoria",
      "fechaInicio": "{{fecha_hora_futura}}",
      "fechaFin": "{{fecha_hora_futura}}",
      "tipoEvento": 1,
      "todoElDia": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 2xx', function () {
          pm.expect(pm.response.code).to.be.oneOf([200,201]);
      });
    language: text/javascript
order: 3000

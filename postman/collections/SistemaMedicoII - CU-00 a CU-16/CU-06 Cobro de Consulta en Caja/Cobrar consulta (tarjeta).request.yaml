$kind: http-request
url: "{{base_url}}/api/caja/cobro"
method: POST
body:
  type: json
  content: |-
    {
      "citaId": "{{cita_id}}",
      "metodoPago": "VISA",
      "ultimosCuatroDigitos": "1234"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 2xx', function () {
          pm.expect(pm.response.code).to.be.oneOf([200,201]);
      });
    language: text/javascript
order: 3000

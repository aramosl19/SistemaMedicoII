<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Paciente - Hospital El Milagro</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .registro-wrap { max-width: 720px; margin: 3rem auto; padding: 0 1.25rem 3rem; position: relative; z-index: 10; }
        .registro-header { display: flex; align-items: center; gap: 0.85rem; border-bottom: 1px solid var(--line); padding-bottom: 1.25rem; margin-bottom: 1.75rem; }
        .badge-mark { width: 46px; height: 46px; flex-shrink: 0; border-radius: 12px 0 12px 0; background: var(--well-bg); border: 1px solid rgba(215,161,122,0.2); color: var(--coffee); display: flex; align-items: center; justify-content: center; }
        .password-wrap { position: relative; }
        .password-wrap input { padding-right: 2.6rem; }
        .toggle-password { position: absolute; right: 0.85rem; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted, #9a9a9a); background: none; border: none; padding: 0; font-size: 0.95rem; }
        .toggle-password:hover { color: var(--coffee); }
    </style>
</head>
<body>
<div class="aurora aurora-a"></div>
<div class="aurora aurora-b"></div>
<div class="paper-grain"></div>

<div class="registro-wrap">
    <div class="card ticket-card" style="padding: 2.25rem;">
        <div class="registro-header">
            <div class="badge-mark"><i class="fa-solid fa-user-plus"></i></div>
            <div>
                <h2 class="text-success" style="margin:0;">Ficha de Registro para Paciente Nuevo</h2>
                <p class="text-muted" style="margin-top:0.25rem;">Complete su información para habilitar el portal de citas.</p>
            </div>
        </div>
        <div id="msg-reg" class="alert"></div>

        <form id="form-reg" onsubmit="registrar(event)" novalidate>
            <div class="form-group">
                <label>Nombre completo (según documento)</label>
                <input type="text" id="nombre" class="form-control">
            </div>

            <div class="d-flex mt-4">
                <div class="form-group flex-1">
                    <label>Documento de identificación (DPI)</label>
                    <input type="text" id="dpi" class="form-control" readonly>
                </div>
                <div class="form-group flex-1">
                    <label>Número de identificación tributaria (NIT)</label>
                    <input type="text" id="nit" class="form-control">
                </div>
            </div>

            <div class="d-flex mt-4">
                <div class="form-group flex-1">
                    <label>Teléfono celular / contacto</label>
                    <input type="text" id="telefono" class="form-control">
                </div>
                <div class="form-group flex-1">
                    <label>Correo electrónico (notificaciones y recibos)</label>
                    <input type="email" id="correo" class="form-control">
                </div>
            </div>

            <div class="form-group mt-4">
                <label>Número de afiliado seguro médico (opcional)</label>
                <input type="text" id="seguro" class="form-control" placeholder="Deje en blanco si no posee seguro">
            </div>

            <hr style="border: 0; border-top: 1px dashed var(--line); margin: 2rem 0;">
            <h4 class="text-primary mb-4">Credenciales de acceso al portal</h4>

            <div class="form-group">
                <label>Nombre de usuario</label>
                <input type="text" id="username" class="form-control" placeholder="Ej. jperez123">
            </div>

            <div class="d-flex mt-4">
                <div class="form-group flex-1">
                    <label>Contraseña maestra</label>
                    <div class="password-wrap">
                        <input type="password" id="password" class="form-control" placeholder="Mínimo 12 caracteres">
                        <button type="button" class="toggle-password" onclick="togglePassword('password', this)" aria-label="Mostrar contraseña" tabindex="-1">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group flex-1">
                    <label>Confirmar contraseña</label>
                    <div class="password-wrap">
                        <input type="password" id="password-confirm" class="form-control" placeholder="Repita la contraseña">
                        <button type="button" class="toggle-password" onclick="togglePassword('password-confirm', this)" aria-label="Mostrar contraseña" tabindex="-1">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
            </div>

            <button type="submit" id="btn-reg" class="btn btn-success mt-4" style="width: 100%; padding: 1rem; font-size: 1.05rem;">Completar registro oficial</button>
            <div style="margin-top: 1rem; text-align: center;">
                <a href="#" onclick="descartarRegistro(); return false;" class="text-muted" style="text-decoration: none;"><i class="fa-solid fa-arrow-left"></i> Volver al portal</a>
            </div>
        </form>
    </div>
</div>
<script src="js/app.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.has('dpi')) {
        document.getElementById('dpi').value = urlParams.get('dpi');
    } else {
        window.location.href = 'index.html';
    }

    async function descartarRegistro() {
        const form = document.getElementById('form-reg');
        const datos = Object.fromEntries(new FormData(form).entries());
        try {
            await App.apiFetch('/api/portal/descartar-registro', 'POST', datos);
        } catch (err) {
        }
        window.location.href = 'index.html';
    }

    // Mejora UX (no pedida por el documento): permite ver/ocultar el texto
    // de la contraseña, tanto en el campo principal como en la confirmación.
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        const mostrar = input.type === 'password';
        input.type = mostrar ? 'text' : 'password';
        icon.classList.toggle('fa-eye', !mostrar);
        icon.classList.toggle('fa-eye-slash', mostrar);
        btn.setAttribute('aria-label', mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña');
    }

    // Toda validación de formato, longitud y coincidencia de contraseñas
    // (incluida la confirmación) la realiza el backend ahora
    // (RegistroExternoRequestDTO). El frontend solo limpia marcas de
    // errores previos y envía los datos tal cual fueron escritos.
    async function registrar(e) {
        e.preventDefault();
        App.hideAlert('msg-reg');

        const form = document.getElementById('form-reg');
        App.clearInvalidFields(form);

        document.getElementById('btn-reg').disabled = true;
        document.getElementById('btn-reg').textContent = "Creando expediente...";

        const payload = {
            nombreCompleto: document.getElementById('nombre').value,
            dpi: document.getElementById('dpi').value,
            nit: document.getElementById('nit').value,
            telefono: document.getElementById('telefono').value,
            correo: document.getElementById('correo').value,
            numeroSeguro: document.getElementById('seguro').value || null,
            nombreUsuario: document.getElementById('username').value,
            password: document.getElementById('password').value,
            confirmarPassword: document.getElementById('password-confirm').value
        };
        try {
            await App.apiFetch('/api/portal/registro', 'POST', payload);
            // FIX CU-02: mensaje literal exacto requerido por el spec
            App.showAlert('msg-reg', '¡Registro exitoso! Su cuenta ha sido creada. Ahora puede iniciar sesión con sus credenciales.');
            setTimeout(() => window.location.href = 'login.html', 3500);
        } catch(err) {
            // FIX CU-02 FA04 (bug #3): el backend rechaza (400/409) por reglas
            // que el frontend no siempre valida en el navegador (ej. username
            // fuera de 8-9 caracteres, password menor a 12, DPI/correo ya
            // registrado).
            //
            // Caso normal (varios campos inválidos a la vez, ej. Bean
            // Validation en RegistroExternoRequestDTO): err.fieldErrors trae
            // el mapa { campoBackend: mensaje } armado por apiFetch, y
            // marcarErroresDeCampos muestra cada mensaje debajo de SU propio
            // input (antes, con markFieldByErrorMessage sobre el mensaje ya
            // concatenado, todos los mensajes terminaban amontonados bajo un
            // único campo).
            const { marcoAlgunCampo, mensajesSinCampo } = App.marcarErroresDeCampos(form, err.fieldErrors, {
                nombreCompleto: 'nombre',
                dpi: 'dpi',
                nit: 'nit',
                telefono: 'telefono',
                correo: 'correo',
                numeroSeguro: 'seguro',
                nombreUsuario: 'username',
                password: 'password',
                confirmarPassword: 'password-confirm',
                passwordsCoinciden: 'password-confirm'
            });

            // Respaldo: si el backend no mandó un mapa por campo (ej. un 409
            // "ya existe" que llega como { mensaje: "..." } suelto), se sigue
            // usando la búsqueda por palabra clave de antes.
            const campo = marcoAlgunCampo
                ? true
                : App.markFieldByErrorMessage(form, err.message, {
                    'usuario': 'username',
                    'contraseña': 'password',
                    'correo': 'correo',
                    'dpi': 'dpi',
                    'nit': 'nit',
                    'teléfono': 'telefono',
                    'telefono': 'telefono',
                    'seguro': 'seguro',
                    'nombre': 'nombre'
                });

            // Si además quedó algún mensaje sin campo (clave del backend no
            // mapeada), se agrega al alert general para no perderlo.
            let textoAlert = campo ? 'Revise los campos marcados en rojo antes de continuar.' : err.message;
            if (mensajesSinCampo.length > 0) {
                textoAlert = campo
                    ? [textoAlert, ...mensajesSinCampo].join(' ')
                    : mensajesSinCampo.join(' | ');
            }
            App.showAlert('msg-reg', textoAlert, true);

            document.getElementById('btn-reg').disabled = false;
            document.getElementById('btn-reg').textContent = "Completar registro oficial";
        }
    }
</script>
</body>
</html>

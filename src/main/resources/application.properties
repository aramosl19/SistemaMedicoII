spring.application.name=SistemaMedicoII
# Conexion a la base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sistema_medico}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate: genera las tablas automaticamente a partir de tus @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Protocolo de transferencia de correos
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Nombre del hospital
app.hospital.nombre=Hospital El Milagro
# Teléfono de contacto (RN-GLOBAL-006: pie de los correos automáticos)
app.hospital.telefono=53590072
# Clave de cifrado para datos sensibles
app.security.encryption-key=${ENCRYPTION_KEY:clave-de-prueba-32-caracteres!!}
# Seguridad JWT
app.jwt.secret=${JWT_SECRET:clave-default-solo-para-test}
app.jwt.expiration-ms=86400000
# CORS restringido al entorno local
app.cors.allowed-origins=*
# Azure Blob Storage (CU-03: documento adjunto en agendamiento de cita)
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.container-documentos=documentos-citas

# ClamAV (escaneo antivirus del PDF adjunto)
clamav.host=${CLAMAV_HOST:localhost}
clamav.port=${CLAMAV_PORT:3310}
clamav.timeout-ms=15000

# Spring por defecto limita multipart a 1MB esta regla la puse para que sean 2mb y no haya problemas con el PDF adjunto en la cita
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Configuración de zona horaria para serialización/deserialización de fechas
spring.jackson.time-zone=America/Guatemala